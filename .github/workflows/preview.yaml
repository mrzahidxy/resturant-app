name: Vercel Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull Vercel environment (preview)
        run: npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build project artifacts
        run: npx vercel@latest build --token="$VERCEL_TOKEN"
      - name: Deploy preview to Vercel
        run: npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"
